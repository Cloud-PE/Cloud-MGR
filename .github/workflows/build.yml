name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare CloudMGR.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force target/x86_64-pc-windows-msvc/release/cloud-pe-plugin-market.exe dist/CloudMGR.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudMGR
          path: dist/CloudMGR.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout upload script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: CloudMGR
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          files: dist/CloudMGR.exe

      - name: Upload CloudMGR.exe to Cloudflare R2
        shell: pwsh
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          & ./.github/scripts/upload-to-r2.ps1 `
            -Prefix "Cloud-PE/Cloud-MGR" `
            -Path "dist/CloudMGR.exe" `
            -PublicBaseUrl "https://r2.cloud-pe.cn"
